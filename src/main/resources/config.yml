# Haven, a concise sethome plugin
#
# Homes store worlds by name. Renaming or deleting a world orphans its homes:
# they stay on disk, but /home reports the world as missing.

# Don't change this, Haven uses it to update this file.
config-version: 2

homes:
  # Home limit for players with no haven.homes.<n> permission.
  # Give ranks haven.homes.5, haven.homes.10, etc. (highest wins), or haven.homes.unlimited for no cap.
  default-limit: 3

  # Seconds a /sethome overwrite confirmation stays valid.
  confirm-timeout-seconds: 15

worlds:
  # Worlds where /sethome is refused (world folder names). Existing homes are kept.
  # Bypass: haven.bypass.worlds
  disabled: []

  # Also block /home teleports into disabled worlds.
  block-teleport: false

  # Max homes per world, on top of the overall limit. Unlisted worlds are uncapped, 0 blocks the world.
  # Bypass: haven.bypass.worlds or haven.homes.unlimited
  # limits:
  #   world_nether: 1
  limits: {}

teleport:
  # Delay before /home teleports. 0 is instant.
  # Bypass: haven.bypass.warmup
  warmup-seconds: 3

  # Time between teleports. 0 disables it. Only starts after a successful teleport.
  # Bypass: haven.bypass.cooldown
  cooldown-seconds: 10

  # Cancel the warmup if the player moves to a different block.
  cancel-on-move: true

  # Cancel the warmup if the player takes damage (fully blocked damage doesn't count).
  cancel-on-damage: true

  # Refuse lava, void and suffocating destinations, and look for the nearest safe spot instead.
  safe-teleport:
    enabled: true
    # Horizontal search radius in blocks (0-8). 0 only checks the exact spot.
    search-radius: 3
    # How far up and down to search (0-16).
    search-height: 4

sharing:
  # Let players share homes with other players.
  enabled: true

  # Max players one home can be shared with (1-100).
  max-per-home: 10

gui:
  # Chest menu for /homes and /haven instead of the chat list (/homes list still works).
  # The menu only teleports. Players need haven.gui to see it.
  enabled: false

update-checker:
  # Check Modrinth for newer stable releases for this Minecraft version. Nothing is downloaded.
  # Runs at startup and after /haven reload.
  enabled: true

  # Hours between checks (1-168). Failed checks retry on the same interval.
  interval-hours: 6

  # Tell players with haven.admin.update (ops by default) about updates. The console is always told.
  notify-admins: true

storage:
  # Seconds shutdown waits for pending saves. Raise it if you see "timed out flushing" on stop.
  shutdown-timeout-seconds: 10

sounds:
  # Master switch for all sounds below.
  enabled: true

  # Each sound takes:
  #   key:    any namespaced sound, resource pack ones included. "" turns that sound off.
  #   volume: 1.0 is normal. Going higher only makes it carry further.
  #   pitch:  0.5 (octave down) to 2.0 (octave up).
  #   source: volume slider it follows: master, music, record, weather,
  #           block, hostile, neutral, player, ambient, voice.

  # Home saved or moved.
  home-set:
    key: minecraft:entity.experience_orb.pickup
    volume: 0.7
    pitch: 1.4
    source: player

  # Home deleted.
  home-deleted:
    key: minecraft:block.wooden_button.click_on
    volume: 0.7
    pitch: 0.8
    source: player

  # Ticks every second during the warmup.
  warmup-tick:
    key: minecraft:block.note_block.hat
    volume: 0.4
    pitch: 1.5
    source: player

  # Teleport finished.
  teleport-success:
    key: minecraft:entity.enderman.teleport
    volume: 0.6
    pitch: 1.2
    source: player

  # Warmup interrupted by moving or damage.
  teleport-cancelled:
    key: minecraft:block.fire.extinguish
    volume: 0.6
    pitch: 1.2
    source: player

  # Command refused (limit reached, on cooldown, no such home).
  denied:
    key: minecraft:block.note_block.bass
    volume: 0.6
    pitch: 0.7
    source: player
