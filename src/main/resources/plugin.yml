name: Haven
description: $description
prefix: HAVEN
version: '${version}'

main: dev.kwlew.haven.Haven
api-version: '1.18'
load: POSTWORLD

authors: [ kwlew ]
website: https://kwlew.dev

softdepend: [ PlaceholderAPI ]

commands:
  sethome:
    description: Save a home at your current location.
    usage: /sethome [name]
    permission: haven.sethome
  home:
    description: Teleport to one of your homes.
    usage: /home [name]
    permission: haven.home
  delhome:
    description: Delete one of your homes.
    usage: /delhome <name>
    aliases: [ removehome ]
    permission: haven.delhome
  homes:
    description: List your homes.
    usage: /homes
    aliases: [ listhomes ]
    permission: haven.homes
  haven:
    description: Haven administration.
    usage: /haven reload
    permission: haven.admin.reload

permissions:
  haven.home:
    description: Teleport to one of your homes.
    default: true
  haven.sethome:
    description: Save a home at your current location.
    default: true
  haven.delhome:
    description: Delete one of your homes.
    default: true
  haven.homes:
    description: List your homes.
    default: true

  # haven.homes.<n> sets the home limit.
  haven.homes.unlimited:
    description: Bypass the home limit entirely.
    default: op
  haven.bypass.warmup:
    description: Teleport instantly, ignoring the warmup.
    default: op
  haven.bypass.cooldown:
    description: Teleport without waiting for the cooldown.
    default: op
  haven.admin.reload:
    description: Reload Haven's configuration and messages.
    default: op
