name: Haven
description: $description
prefix: HAVEN
version: '${version}'

main: dev.kwlew.haven.Haven
api-version: '1.18'
load: POSTWORLD

authors: [ kwlew ]
website: https://kwlew.dev

soft-depend: [ PlaceholderAPI ]

permissions:
  haven.home:
    description: Teleport to one of your homes.
    default: true
  haven.sethome:
    description: Save a home at your current location.
    default: true
  haven.delhome:
    description: Delete one of your homes.
    default: true
  haven.homes:
    description: List your homes.
    default: true

  # haven.homes.<n> sets the home limit.
  haven.homes.unlimited:
    description: Bypass the home limit entirely.
    default: op
  haven.bypass.warmup:
    description: Teleport instantly, ignoring the warmup.
    default: op
  haven.bypass.cooldown:
    description: Teleport without waiting for the cooldown.
    default: op
  haven.admin.reload:
    description: Reload Haven's configuration and messages.
    default: op
