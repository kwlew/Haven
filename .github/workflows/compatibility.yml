name: Paper compatibility

on:
  push:
  pull_request:

jobs:
  paper:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { paper: '1.18.2', java: '17' }
          - { paper: '1.19.4', java: '17' }
          - { paper: '1.20.4', java: '21' }
          - { paper: '1.20.6', java: '21' }
          - { paper: '1.21.1', java: '21' }
          - { paper: '1.21.11', java: '21' }
          - { paper: '26.1.2', java: '25' }
          - { paper: '26.2', java: '25' }
          - { paper: '26.3', java: '25' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Unit tests and release jar
        if: matrix.paper == '1.18.2'
        run: JAVA_HOME="$JAVA_HOME_25_X64" bash gradlew --no-configuration-cache test shadowJar
      - name: Server smoke test
        run: |
          runtime_home_var="JAVA_HOME_${{ matrix.java }}_X64"
          export PAPER_JAVA_HOME="${!runtime_home_var}"
          export JAVA_HOME="$JAVA_HOME_25_X64"
          python3 scripts/smoke-paper.py '${{ matrix.paper }}' '${{ matrix.java }}'
